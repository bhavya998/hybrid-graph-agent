[project]
name = "hga"
version = "0.1.0"
description = "Hybrid RAG + GraphRAG + Multi-Agent research assistant over arXiv papers + linked code"
readme = "README.md"
authors = [{ name = "noob_boy", email = "bhavya260@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # --- config / utils ---
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "rich>=13.9",
    "typer>=0.15",
    "tenacity>=9.0",
    # --- LLM providers (All-API) ---
    "anthropic>=0.40",
    "voyageai>=0.3",
    "cohere>=5.13",
    # --- vector store (local file mode) ---
    "qdrant-client>=1.12",
    # --- orchestration ---
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langgraph>=0.6",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-mcp-adapters>=0.1",
    "mcp>=1.2",
    # --- ingestion ---
    "docling>=2.20",
    "llama-parse>=0.6",
    "arxiv>=2.1",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "tree-sitter>=0.24",
    "tree-sitter-language-pack>=0.4",
    "pillow>=11.0",
    # --- graph ---
    "graphrag>=0.5",
    "kuzu>=0.8",
    "networkx>=3.4",
    # --- serving ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "chainlit>=2.0",
    # --- eval / observability (custom harness; ragas dropped — sunset-dep coupling) ---
    "langfuse>=2.5",
    "mlflow>=2.18",
    # --- data ---
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "datasets>=3.1",
    "fastembed>=0.8.0",
    "sentence-transformers>=5.6.0",
    "bitsandbytes>=0.49.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ipython>=8.30",
]

[project.scripts]
hga = "hga.cli:app"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "TCH"]

[tool.ruff.lint.isort]
known-first-party = ["hga"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["graphrag.*", "kuzu.*", "voyageai.*", "ragas.*", "docling.*", "llama_parse.*", "arxiv", "pandas", "yaml", "sentence_transformers", "transformers", "bitsandbytes"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["voyageai", "voyageai.*"]
implicit_reexport = true

[[tool.mypy.overrides]]
module = ["chainlit", "chainlit.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["hga.llm.local_llm", "hga.retrieval.local_reranker"]
disable_error_code = ["no-untyped-call"]

[[tool.mypy.overrides]]
module = ["hga.serving.chat"]
disable_error_code = ["no-untyped-call"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["voyageai", "voyageai.*"]
implicit_reexport = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
